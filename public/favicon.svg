<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Plate Rim -->
  <circle cx="32" cy="32" r="28" fill="url(#plateGrad)" filter="url(#shadow)"/>
  
  <!-- Inner Rim Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Plate Center Surface -->
  <circle cx="32" cy="32" r="19" fill="#090b0e"/>

  <!-- Upward Trend / Fork & Spoon Accent Arrow -->
  <!-- Fork -->
  <path d="M24 22v6a2 2 0 0 0 2 2v10a1.5 1.5 0 0 0 3 0V30a2 2 0 0 0 2-2v-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="22" x2="27" y2="27" stroke="#ffffff" stroke-width="1.8"/>

  <!-- Spoon / Leaf Up Accent -->
  <path d="M37 22c-3 0-4.5 3.5-4.5 6s1.5 4 4.5 4v8a1.5 1.5 0 0 0 3 0v-8c3 0 4.5-1.5 4.5-4s-1.5-6-4.5-6" fill="#10b981"/>
  <circle cx="37" cy="26" r="1.5" fill="#ffffff"/>
</svg>
